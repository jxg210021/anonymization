{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
  <div class="mt-5">
    <h2>Health Data Redaction Tool</h2>
    <form method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label for="file">Upload a .txt file:</label>
        <input type="file" name="file" id="file" class="form-control-file" required>
      </div>
      <button type="submit" class="btn btn-primary mt-2">Redact</button>
    </form>
    
    {% if redacted_output %}
      <div class="mt-4">
        <h4>Redacted Output:</h4>
        <pre style="white-space: pre-wrap;">{{ redacted_output }}</pre>
      </div>
    {% endif %}
  </div>
{% endblock %}
